[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sassafras"
version = "0.1.0"
description = "Sassafras: Small Angle Scattering Structure- and Form-factor RApid aSsessment. A SANS/SAXS data viewer with live sasmodels overlays for chi-by-eye checks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Oliver Hammond"}]
dependencies = ["sasmodels>=1.0.7", "sasdata>=0.9", "numpy"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sassafras = "sassafras.server:main"

[tool.setuptools]
packages = ["sassafras"]

[tool.setuptools.package-data]
sassafras = ["static/*"]
