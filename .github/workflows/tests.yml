name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SASSAFRAS_NO_FETCH: "1"      # never download the curve library in CI
  SAS_OPENCL: none            # sasmodels: compiled C kernels, no GPU on the runners

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" nbclient nbformat ipykernel
      - name: Test
        run: python -m pytest -q
      - name: Start-up check
        run: sassafras --check

  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel holds the data licence but not the curve library
        run: |
          python -m zipfile -l dist/*.whl | grep -q "sassafras/ml/SAS-55M-20k_LICENSE.txt"
          ! python -m zipfile -l dist/*.whl | grep -q "library/logI.npy"
