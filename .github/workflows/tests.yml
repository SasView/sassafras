name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  SAS_OPENCL: none            # sasmodels: compiled C kernels, no GPU on the runners

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }} · ${{ matrix.extras }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        extras: ["test"]                       # viewer only: fit/notebook/guess tests skip
        include:
          - {os: ubuntu-latest, python: "3.12", extras: "test,fit,notebook"}
          - {os: macos-latest, python: "3.12", extras: "test,fit,notebook"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extras }}]" nbclient nbformat ipykernel
      - name: Test
        run: python -m pytest -q
      - name: Start-up check
        run: sassafras --check

  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: The wheel holds the ML model but not the curve library
        run: |
          python -m zipfile -l dist/*.whl | grep -q "sassafras/ml/model.pt"
          ! python -m zipfile -l dist/*.whl | grep -q "library/logI.npy"
